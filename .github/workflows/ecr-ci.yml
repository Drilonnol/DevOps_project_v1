name: Docker ECR CI

on:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read
#aws sts get-caller-identity
env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: dev-eks-cluster-dev-ecr-repo
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- Backend ----------------

      - name: Backend Metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=backend-
            type=raw,value=backend-latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./BackBs/bookstore
          file: ./BackBs/bookstore/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- Frontend ----------------

      - name: Frontend Metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=frontend-
            type=raw,value=frontend-latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FrontBs/bookstore
          file: ./FrontBs/bookstore/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max