name: Docker ECR CI

# on:
#   push:
#     branches:
#       - main
#       - feature/**

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dev-eks-cluster-dev-ecr-repo
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== OIDC Token Payload ==="
          echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: github-actions-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- Backend ----------------

      - name: Backend Metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=backend-
            type=raw,value=backend-latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./BackBs/bookstore
          file: ./BackBs/bookstore/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- Frontend ----------------

      - name: Frontend Metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=frontend-
            type=raw,value=frontend-latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FrontBs/bookstore
          file: ./FrontBs/bookstore/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max