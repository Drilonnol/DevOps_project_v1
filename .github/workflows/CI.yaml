name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main


jobs:

  backend-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven


      - name: Run Tests
        working-directory: BackBs/bookstore
        run: mvn clean test


      - name: Kotlin Lint
        working-directory: BackBs/bookstore
        run: mvn ktlint:check