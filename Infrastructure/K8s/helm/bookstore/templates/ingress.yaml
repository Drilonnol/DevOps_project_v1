{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bookstore.fullname" . }}-ingress
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.paths.frontend.service }}
                port:
                  number: {{ .Values.ingress.paths.frontend.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.paths.backend.service }}
                port:
                  number: {{ .Values.ingress.paths.backend.port }}
{{- end }}