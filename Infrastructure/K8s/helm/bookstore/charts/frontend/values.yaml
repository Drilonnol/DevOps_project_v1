replicaCount: 1
image:
  repository: 071540691508.dkr.ecr.us-east-1.amazonaws.com/dev-eks-cluster-dev-ecr-repo
  tag: frontend-latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
containerPort: 80

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false