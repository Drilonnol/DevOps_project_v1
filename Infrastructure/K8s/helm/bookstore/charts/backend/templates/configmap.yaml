apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "backend.fullname" . }}

data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfile | quote }}

  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Values.config.database.host }}:{{ .Values.config.database.port }}/{{ .Values.config.database.name }}"