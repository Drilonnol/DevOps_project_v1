replicaCount: 1

image:
  repository: ghcr.io/drilonnol/bookstore-backend
  tag: sha-afdfab4
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret

containerPort: 8081

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

config:
  springProfile: prod
  database:
    host: bookstore-postgresql
    port: 5432
    name: bookstore

secret:
  dbUsername: postgres
  dbPassword: changemeinprod!
  jwtSecret: my-secret-key

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false