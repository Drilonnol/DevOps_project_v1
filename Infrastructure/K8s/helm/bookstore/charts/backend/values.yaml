replicaCount: 1

image:
  repository: ghcr.io/drilonnol/bookstore-backend
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret

containerPort: 8081

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

config:
  springProfile: prod
  database:
    name: bookstore

secret:
  dbUsername: postgres
  dbPassword: changemeinprod!
  jwtSecret: my-secret-key

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
autoscaling:
  enabled: false