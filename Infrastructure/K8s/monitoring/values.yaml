# kube-prometheus-stack custom values
prometheus:
  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  prometheusSpec:
    # Resource limits
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m

    # Storage configuration
    storageSpec:
      emptyDir: {}

    # Retention settings
    retention: 15d
    retentionSize: 18GB

    # Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Enable admin API
    enableAdminAPI: true

    # Allow discovery of ServiceMonitors and PrometheusRules regardless of helm release labels
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'drilo2020@gmail.com'
      smtp_auth_username: 'drilo2020@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp/smtp-auth-password'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        - matchers:
            - severity="critical"
          receiver: 'default-receiver'
          continue: true
        - matchers:
            - severity="warning"
          receiver: 'default-receiver'
        - matchers:
            - service=~"^(api|web)$"
          receiver: 'default-receiver'

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'drilo2020@gmail.com'
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'cluster', 'service']

  alertmanagerSpec:
    secrets:
    - alertmanager-smtp

    storage:
      emptyDir: {}

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

grafana:
  enabled: true

  # Service configuration
  service:
    type: LoadBalancer

  # Admin credentials
  adminPassword: "admin-password"

  # Persistence
  persistence:
    enabled: false

  # Resources
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Dashboard sidecar discovery
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus

# Node Exporter configuration
nodeExporter:
  enabled: true

# kube-state-metrics configuration
kubeStateMetrics:
  enabled: true

# Default scraping configurations
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true