server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /v1/ API calls to the backend.
    # In Kubernetes the K8s ConfigMap overrides this file at runtime via a volume mount,
    # pointing to the correct backend service name (e.g. bookstore-backend:8081).
    # This fallback target is only used when running the image outside of Kubernetes
    # (e.g. docker run / docker compose) and BACKEND_HOST must resolve in that context.
    location /v1/ {
        proxy_pass http://bookstore-backend:8081/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
